# Stage B media stack. Jellyfin and qBittorrent run natively on Windows
# (task book §7.1 / §7.7). Start only via start.ps1, which runs the storage gate first.
# Media: the LER-MEDIA volume via drive letter M: (containers can't traverse the
# Z:\LER-MEDIA mount point). App databases live in named volumes, never on the bind.
name: ler-media

x-media: &media
  type: bind
  source: 'M:\'
  target: /data
  bind:
    create_host_path: false

x-common: &common
  restart: unless-stopped
  environment:
    TZ: Australia/Sydney
    PUID: "1000"
    PGID: "1000"
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  sonarr:
    <<: *common
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls329
    ports: ["127.0.0.1:8989:8989"]
    volumes:
      - sonarr-config:/config
      - *media

  radarr:
    <<: *common
    image: lscr.io/linuxserver/radarr:6.4.4.10685-ls324
    ports: ["127.0.0.1:7878:7878"]
    volumes:
      - radarr-config:/config
      - *media

  prowlarr:
    <<: *common
    image: lscr.io/linuxserver/prowlarr:2.7.0.5723-ls166
    ports: ["127.0.0.1:9696:9696"]
    volumes:
      - prowlarr-config:/config

  seerr:
    <<: *common
    image: ghcr.io/seerr-team/seerr:v3.5.1
    init: true
    ports: ["127.0.0.1:5055:5055"]
    environment:
      TZ: Australia/Sydney
      LOG_LEVEL: info
    volumes:
      - seerr-config:/app/config

volumes:
  sonarr-config:
  radarr-config:
  prowlarr-config:
  seerr-config:
